<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="color-scheme" content="light dark">

<title>Internal Mailbox</title>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

:root{
  --bg:#f3f6fa;
  --panel:#ffffff;
  --panel-soft:#f8fafc;
  --text:#172033;
  --muted:#6b7280;
  --border:#e4e9f0;
  --primary:#2563eb;
  --primary-dark:#1d4ed8;
  --danger:#dc2626;
  --success:#16a34a;
  --warning:#d97706;
  --hover:#f1f5f9;
  --selected:#eaf2ff;
  --shadow:0 12px 35px rgba(20,35,60,.09);
}

@media(prefers-color-scheme:dark){

  :root{
    --bg:#0c1117;
    --panel:#111820;
    --panel-soft:#151d27;
    --text:#edf2f7;
    --muted:#9aa6b6;
    --border:#27313d;
    --hover:#18222d;
    --selected:#172d4e;
    --shadow:0 12px 35px rgba(0,0,0,.28);
  }

}

html,
body{
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:Inter,Segoe UI,Roboto,Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
}

button,
input,
textarea{
  font:inherit;
}

button{
  cursor:pointer;
}

.app{
  width:100%;
  height:100vh;
  display:flex;
  flex-direction:column;
}


/* =========================================================
   TOP BAR
   ========================================================= */

.topbar{
  height:68px;
  flex:none;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 20px;
  background:var(--panel);
  border-bottom:1px solid var(--border);
  z-index:20;
}

.brand{
  display:flex;
  align-items:center;
  gap:11px;
  min-width:220px;
}

.brand-logo{
  width:40px;
  height:40px;
  border-radius:12px;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#fff;
  background:linear-gradient(135deg,#2563eb,#4f46e5);
}

.brand-logo svg{
  width:22px;
  height:22px;
}

.brand-name{
  font-size:16px;
  font-weight:750;
}

.brand-sub{
  font-size:11px;
  color:var(--muted);
  margin-top:2px;
}

.search{
  flex:1;
  max-width:580px;
  margin:0 25px;
  position:relative;
}

.search input{
  width:100%;
  height:42px;
  border:1px solid var(--border);
  background:var(--panel-soft);
  border-radius:13px;
  outline:none;
  padding:0 42px;
  color:var(--text);
  font-size:13px;
}

.search input:focus{
  border-color:var(--primary);
  box-shadow:0 0 0 3px rgba(37,99,235,.09);
}

.search-icon{
  position:absolute;
  left:14px;
  top:12px;
  color:var(--muted);
}

.clear-search{
  position:absolute;
  right:8px;
  top:6px;
  width:30px;
  height:30px;
  border:0;
  background:transparent;
  color:var(--muted);
  border-radius:8px;
  display:none;
}

.clear-search:hover{
  background:var(--hover);
}

.account{
  min-width:220px;
  display:flex;
  justify-content:flex-end;
  align-items:center;
  gap:10px;
}

.avatar{
  width:37px;
  height:37px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  background:linear-gradient(135deg,#2563eb,#4f46e5);
  color:#fff;
  font-weight:700;
  font-size:13px;
}

.account-info{
  text-align:right;
}

.account-name{
  font-size:13px;
  font-weight:700;
}

.account-role{
  color:var(--muted);
  font-size:11px;
}

.icon-btn{
  width:38px;
  height:38px;
  border:0;
  border-radius:11px;
  background:transparent;
  color:var(--muted);
  display:flex;
  align-items:center;
  justify-content:center;
}

.icon-btn:hover{
  background:var(--hover);
  color:var(--text);
}

.icon-btn svg{
  width:18px;
  height:18px;
}


/* =========================================================
   MAIN
   ========================================================= */

.main{
  flex:1;
  min-height:0;
  display:flex;
}


/* =========================================================
   SIDEBAR
   ========================================================= */

.sidebar{
  width:235px;
  flex:none;
  background:var(--panel);
  border-right:1px solid var(--border);
  padding:18px 12px;
  overflow:auto;
}

.compose-btn{
  width:100%;
  height:46px;
  border:0;
  border-radius:14px;
  background:linear-gradient(135deg,#2563eb,#4f46e5);
  color:#fff;
  font-size:13px;
  font-weight:700;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:9px;
  margin-bottom:20px;
  box-shadow:0 9px 20px rgba(37,99,235,.20);
}

.compose-btn:hover{
  transform:translateY(-1px);
}

.folder-title{
  font-size:10px;
  text-transform:uppercase;
  letter-spacing:.08em;
  color:var(--muted);
  font-weight:700;
  padding:0 12px 8px;
}

.folder{
  width:100%;
  height:40px;
  display:flex;
  align-items:center;
  border:0;
  background:transparent;
  color:var(--text);
  border-radius:11px;
  padding:0 11px;
  gap:11px;
  font-size:13px;
  margin-bottom:3px;
}

.folder:hover{
  background:var(--hover);
}

.folder.active{
  background:var(--selected);
  color:var(--primary);
  font-weight:700;
}

.folder svg{
  width:17px;
  height:17px;
  flex:none;
}

.folder-count{
  margin-left:auto;
  min-width:22px;
  padding:2px 6px;
  border-radius:10px;
  background:var(--primary);
  color:#fff;
  font-size:10px;
  font-weight:700;
  text-align:center;
}

.logout-side{
  margin-top:20px;
  padding-top:15px;
  border-top:1px solid var(--border);
}

.logout-side button{
  width:100%;
  border:0;
  background:transparent;
  height:40px;
  border-radius:11px;
  display:flex;
  align-items:center;
  gap:11px;
  padding:0 11px;
  color:var(--danger);
  font-size:13px;
}

.logout-side button:hover{
  background:rgba(220,38,38,.08);
}


/* =========================================================
   MAIL LIST
   ========================================================= */

.mail-area{
  width:430px;
  flex:none;
  min-width:320px;
  background:var(--panel);
  border-right:1px solid var(--border);
  display:flex;
  flex-direction:column;
}

.list-head{
  height:58px;
  flex:none;
  padding:0 15px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  border-bottom:1px solid var(--border);
}

.list-title{
  font-size:15px;
  font-weight:750;
}

.list-actions{
  display:flex;
  gap:3px;
}

.mail-list{
  flex:1;
  overflow:auto;
}

.mail-row{
  min-height:82px;
  border-bottom:1px solid var(--border);
  padding:13px 15px;
  display:flex;
  gap:10px;
  position:relative;
  cursor:pointer;
  transition:.12s;
}

.mail-row:hover{
  background:var(--hover);
}

.mail-row.selected{
  background:var(--selected);
}

.mail-row.unread{
  background:rgba(37,99,235,.035);
}

.mail-row.unread .sender{
  font-weight:750;
}

.mail-check{
  width:18px;
  flex:none;
  padding-top:3px;
}

.mail-check input{
  width:15px;
  height:15px;
  accent-color:var(--primary);
}

.mail-main{
  min-width:0;
  flex:1;
}

.mail-top{
  display:flex;
  align-items:center;
  gap:8px;
}

.sender{
  min-width:0;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  font-size:13px;
}

.date{
  margin-left:auto;
  flex:none;
  color:var(--muted);
  font-size:10px;
}

.subject{
  font-size:12px;
  font-weight:650;
  margin-top:6px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.preview{
  color:var(--muted);
  font-size:11px;
  margin-top:4px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.star{
  width:22px;
  height:22px;
  flex:none;
  border:0;
  background:transparent;
  color:#a3adba;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:7px;
}

.star:hover{
  background:var(--hover);
}

.star.active{
  color:#f59e0b;
}

.star svg{
  width:15px;
  height:15px;
}

.empty{
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  color:var(--muted);
  padding:30px;
  text-align:center;
}

.empty svg{
  width:46px;
  height:46px;
  margin-bottom:12px;
  opacity:.45;
}

.empty-title{
  color:var(--text);
  font-weight:700;
  font-size:14px;
  margin-bottom:5px;
}

.empty-text{
  font-size:12px;
}


/* =========================================================
   READING PANE
   ========================================================= */

.read-pane{
  flex:1;
  min-width:0;
  background:var(--panel);
  display:flex;
  flex-direction:column;
}

.read-empty{
  flex:1;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  color:var(--muted);
}

.read-empty svg{
  width:58px;
  height:58px;
  opacity:.35;
  margin-bottom:15px;
}

.read-empty strong{
  color:var(--text);
  font-size:14px;
  margin-bottom:5px;
}

.read-empty span{
  font-size:12px;
}

.read-header{
  flex:none;
  padding:20px 25px 16px;
  border-bottom:1px solid var(--border);
}

.read-actions{
  display:flex;
  align-items:center;
  gap:5px;
  margin-bottom:20px;
}

.read-actions .icon-btn{
  width:35px;
  height:35px;
}

.read-subject{
  font-size:21px;
  line-height:1.3;
  font-weight:750;
  word-break:break-word;
}

.read-meta{
  display:flex;
  gap:11px;
  align-items:flex-start;
  margin-top:17px;
}

.read-avatar{
  width:38px;
  height:38px;
  flex:none;
  border-radius:50%;
  background:linear-gradient(135deg,#2563eb,#4f46e5);
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:12px;
  font-weight:700;
}

.read-sender{
  min-width:0;
  flex:1;
}

.read-sender-name{
  font-weight:700;
  font-size:13px;
}

.read-sender-email{
  color:var(--muted);
  font-size:11px;
  margin-top:2px;
}

.read-date{
  color:var(--muted);
  font-size:11px;
}

.read-recipients{
  color:var(--muted);
  font-size:11px;
  margin-top:7px;
}

.read-body{
  flex:1;
  overflow:auto;
  padding:26px;
  font-size:13px;
  line-height:1.7;
  word-break:break-word;
}

.read-body img{
  max-width:100%;
  height:auto;
}

.read-body a{
  color:var(--primary);
}

.attachment-list{
  padding:0 26px 20px;
}

.attachment{
  display:inline-flex;
  align-items:center;
  gap:8px;
  padding:9px 11px;
  margin:5px;
  border:1px solid var(--border);
  border-radius:10px;
  color:var(--text);
  font-size:11px;
  background:var(--panel-soft);
}


/* =========================================================
   COMPOSE
   ========================================================= */

.modal{
  position:fixed;
  inset:0;
  background:rgba(10,15,25,.52);
  backdrop-filter:blur(5px);
  -webkit-backdrop-filter:blur(5px);
  display:none;
  align-items:center;
  justify-content:center;
  padding:18px;
  z-index:100;
}

.modal.show{
  display:flex;
}

.compose{
  width:100%;
  max-width:720px;
  max-height:calc(100vh - 36px);
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:19px;
  box-shadow:0 30px 80px rgba(0,0,0,.28);
  overflow:hidden;
  display:flex;
  flex-direction:column;
}

.compose-head{
  height:55px;
  flex:none;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 16px;
  border-bottom:1px solid var(--border);
}

.compose-title{
  font-size:14px;
  font-weight:750;
}

.compose-body{
  padding:15px 18px;
  overflow:auto;
}

.compose-row{
  display:flex;
  align-items:center;
  min-height:42px;
  border-bottom:1px solid var(--border);
  gap:9px;
}

.compose-label{
  width:55px;
  flex:none;
  color:var(--muted);
  font-size:12px;
}

.compose-input{
  flex:1;
  min-width:0;
  height:38px;
  border:0;
  outline:0;
  background:transparent;
  color:var(--text);
  font-size:13px;
}

.compose-area{
  width:100%;
  min-height:280px;
  border:0;
  outline:0;
  resize:vertical;
  padding:16px 0;
  background:transparent;
  color:var(--text);
  font-size:13px;
  line-height:1.7;
}

.compose-foot{
  min-height:58px;
  flex:none;
  padding:10px 15px;
  border-top:1px solid var(--border);
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.compose-left{
  display:flex;
  gap:4px;
}

.send-btn{
  min-width:105px;
  height:39px;
  border:0;
  border-radius:11px;
  background:linear-gradient(135deg,#2563eb,#4f46e5);
  color:#fff;
  font-size:12px;
  font-weight:700;
  display:flex;
  justify-content:center;
  align-items:center;
  gap:8px;
}

.send-btn:disabled{
  opacity:.7;
  cursor:not-allowed;
}

.send-spinner{
  display:none;
  width:15px;
  height:15px;
  border:2px solid rgba(255,255,255,.4);
  border-top-color:#fff;
  border-radius:50%;
  animation:spin .7s linear infinite;
}

.send-btn.loading .send-spinner{
  display:block;
}

.send-btn.loading .send-label{
  display:none;
}

.autocomplete{
  position:absolute;
  left:74px;
  right:18px;
  top:40px;
  z-index:10;
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:11px;
  box-shadow:var(--shadow);
  overflow:hidden;
  display:none;
}

.autocomplete.show{
  display:block;
}

.suggestion{
  padding:9px 11px;
  cursor:pointer;
  border-bottom:1px solid var(--border);
}

.suggestion:last-child{
  border-bottom:0;
}

.suggestion:hover{
  background:var(--hover);
}

.suggestion-name{
  font-size:12px;
  font-weight:650;
}

.suggestion-email{
  color:var(--muted);
  font-size:10px;
  margin-top:2px;
}

.compose-to-wrap{
  position:relative;
  flex:1;
}


/* =========================================================
   TOAST
   ========================================================= */

.toast{
  position:fixed;
  left:50%;
  bottom:25px;
  transform:translate(-50%,120px);
  background:var(--panel);
  border:1px solid var(--border);
  box-shadow:0 16px 45px rgba(0,0,0,.18);
  border-radius:14px;
  padding:13px 17px;
  min-width:280px;
  max-width:calc(100% - 30px);
  z-index:300;
  transition:.35s ease;
  display:flex;
  gap:10px;
  align-items:center;
}

.toast.show{
  transform:translate(-50%,0);
}

.toast.success{
  border-left:4px solid var(--success);
}

.toast.error{
  border-left:4px solid var(--danger);
}

.toast-icon{
  width:20px;
  height:20px;
  flex:none;
}

.toast-message{
  font-size:12px;
  line-height:1.4;
}


/* =========================================================
   LOADING
   ========================================================= */

.loading-overlay{
  position:fixed;
  inset:0;
  background:rgba(243,246,250,.76);
  backdrop-filter:blur(3px);
  z-index:250;
  display:none;
  align-items:center;
  justify-content:center;
}

@media(prefers-color-scheme:dark){
  .loading-overlay{
    background:rgba(12,17,23,.72);
  }
}

.loading-overlay.show{
  display:flex;
}

.loading-box{
  padding:22px 28px;
  border-radius:16px;
  background:var(--panel);
  border:1px solid var(--border);
  box-shadow:var(--shadow);
  display:flex;
  align-items:center;
  gap:12px;
  font-size:12px;
}

.big-spinner{
  width:21px;
  height:21px;
  border:2px solid rgba(37,99,235,.20);
  border-top-color:var(--primary);
  border-radius:50%;
  animation:spin .7s linear infinite;
}


/* =========================================================
   RESPONSIVE
   ========================================================= */

@media(max-width:1000px){

  .sidebar{
    width:190px;
  }

  .mail-area{
    width:360px;
  }

  .account-info{
    display:none;
  }

}

@media(max-width:760px){

  .topbar{
    padding:0 10px;
  }

  .brand{
    min-width:auto;
  }

  .brand-sub{
    display:none;
  }

  .brand-name{
    display:none;
  }

  .search{
    margin:0 8px;
  }

  .account{
    min-width:auto;
  }

  .sidebar{
    width:64px;
    padding:12px 7px;
  }

  .compose-btn span,
  .folder span:not(.folder-count),
  .logout-side span{
    display:none;
  }

  .compose-btn{
    height:42px;
  }

  .folder{
    justify-content:center;
    padding:0;
  }

  .folder-count{
    position:absolute;
    margin:0;
    transform:translate(12px,-11px);
    min-width:16px;
    font-size:8px;
    padding:1px 4px;
  }

  .folder{
    position:relative;
  }

  .folder-title{
    display:none;
  }

  .mail-area{
    width:calc(100vw - 64px);
    border-right:0;
  }

  .read-pane{
    position:fixed;
    inset:68px 0 0 64px;
    z-index:30;
    display:none;
  }

  .read-pane.mobile-show{
    display:flex;
  }

  .mobile-back{
    display:flex!important;
  }

}

@media(min-width:761px){

  .mobile-back{
    display:none!important;
  }

}

@media(max-width:520px){

  .search{
    max-width:none;
  }

  .mail-area{
    width:calc(100vw - 64px);
  }

  .read-header{
    padding:16px;
  }

  .read-body{
    padding:18px;
  }

  .compose{
    max-height:100vh;
    border-radius:15px;
  }

}

@keyframes spin{
  to{transform:rotate(360deg)}
}

.hidden{
  display:none!important;
}

</style>
</head>

<body>

<div class="app">


<!-- ======================================================
     TOP BAR
     ====================================================== -->

<header class="topbar">

  <div class="brand">

    <div class="brand-logo">
      <svg viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="1.8"
           stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 5.5h16v13H4z"/>
        <path d="m4 7 8 6 8-6"/>
      </svg>
    </div>

    <div>
      <div class="brand-name">Internal Mailbox</div>
      <div class="brand-sub">Secure internal communication</div>
    </div>

  </div>


  <div class="search">

    <svg class="search-icon" width="17" height="17"
         viewBox="0 0 24 24" fill="none"
         stroke="currentColor" stroke-width="2"
         stroke-linecap="round">
      <circle cx="11" cy="11" r="7"/>
      <path d="m20 20-4-4"/>
    </svg>

    <input
      id="searchInput"
      type="search"
      placeholder="Search mail..."
      autocomplete="off"
    >

    <button id="clearSearch" class="clear-search">
      ×
    </button>

  </div>


  <div class="account">

    <button id="refreshBtn" class="icon-btn" title="Refresh">
      <svg viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="1.8"
           stroke-linecap="round">
        <path d="M20 11a8 8 0 0 0-14.8-4"/>
        <path d="M4 4v5h5"/>
        <path d="M4 13a8 8 0 0 0 14.8 4"/>
        <path d="M20 20v-5h-5"/>
      </svg>
    </button>

    <div class="account-info">
      <div id="accountName" class="account-name">User</div>
      <div id="accountRole" class="account-role">Mailbox User</div>
    </div>

    <div id="avatar" class="avatar">U</div>

  </div>

</header>


<!-- ======================================================
     MAIN
     ====================================================== -->

<main class="main">


<!-- ======================================================
     SIDEBAR

<script>

/* =========================================================
   INTERNAL MAILBOX CONFIGURATION
   ========================================================= */

const MAILBOX_CONFIG = {

  API_URL:
    "https://script.google.com/macros/s/AKfycbwuH5EQultZgZXL8b-92sPGa8RP4A24xwacuhMQgT9_Zb_lOu2NQ3Ijaebcvu4B8KAF/exec",

  AUTO_REFRESH_MS: 60000,

  SEARCH_DELAY_MS: 350,

  SUGGESTION_DELAY_MS: 250,

  PAGE_SIZE: 100

};


/* =========================================================
   STORAGE
   ========================================================= */

const SESSION_KEY = "internal_mailbox_session";
const USER_KEY = "internal_mailbox_user";


/* =========================================================
   APPLICATION STATE
   ========================================================= */

const state = {

  session: null,

  user: null,

  activeFolder: "INBOX",

  messages: [],

  selectedMailId: null,

  selectedMessage: null,

  searchMode: false,

  searchQuery: "",

  composeMode: "new",

  composeMessageId: null,

  refreshTimer: null,

  searchTimer: null,

  suggestionTimer: null,

  loading: false

};


/* =========================================================
   ELEMENT HELPER
   ========================================================= */

const $ = id => document.getElementById(id);


/* =========================================================
   INITIALIZATION
   ========================================================= */

document.addEventListener(
  "DOMContentLoaded",
  init
);


async function init(){

  loadSession();


  if(!state.session){

    window.location.href = "index.html";

    return;

  }


  populateUser();


  /*
   * IMPORTANT:
   * This function was missing in your previous HTML.
   */
  bindEvents();


  await loadMailbox(true);


  startAutoRefresh();

}


/* =========================================================
   EVENT BINDING
   ========================================================= */

function bindEvents(){

  /* -------------------------------------------------------
     SEARCH
     ------------------------------------------------------- */

  $("searchInput")
    .addEventListener(
      "input",
      handleSearchInput
    );


  $("clearSearch")
    .addEventListener(
      "click",
      clearSearch
    );


  /* -------------------------------------------------------
     FOLDERS
     ------------------------------------------------------- */

  document
    .querySelectorAll(".folder")
    .forEach(button => {

      button.addEventListener(
        "click",
        () => {

          switchFolder(
            button.dataset.folder
          );

        }
      );

    });


  /* -------------------------------------------------------
     REFRESH
     ------------------------------------------------------- */

  $("refreshBtn")
    .addEventListener(
      "click",
      () => loadMailbox(true)
    );


  $("listRefreshBtn")
    .addEventListener(
      "click",
      () => loadMailbox(true)
    );


  /* -------------------------------------------------------
     SELECT ALL
     ------------------------------------------------------- */

  $("selectAllBtn")
    .addEventListener(
      "click",
      selectAllMessages
    );


  /* -------------------------------------------------------
     COMPOSE
     ------------------------------------------------------- */

  $("composeBtn")
    .addEventListener(
      "click",
      () => openCompose("new")
    );


  $("closeCompose")
    .addEventListener(
      "click",
      closeCompose
    );


  $("sendBtn")
    .addEventListener(
      "click",
      sendCurrentMessage
    );


  $("saveDraftBtn")
    .addEventListener(
      "click",
      saveDraft
    );


  $("composeModal")
    .addEventListener(
      "click",
      event => {

        if(
          event.target ===
          $("composeModal")
        ){

          closeCompose();

        }

      }
    );


  /* -------------------------------------------------------
     RECIPIENT SUGGESTIONS
     ------------------------------------------------------- */

  $("composeTo")
    .addEventListener(
      "input",
      handleRecipientInput
    );


  /* -------------------------------------------------------
     READ ACTIONS
     ------------------------------------------------------- */

  $("replyBtn")
    .addEventListener(
      "click",
      () => {

        if(state.selectedMessage){

          openCompose(
            "reply",
            state.selectedMessage
          );

        }

      }
    );


  $("forwardBtn")
    .addEventListener(
      "click",
      () => {

        if(state.selectedMessage){

          openCompose(
            "forward",
            state.selectedMessage
          );

        }

      }
    );


  $("starReadBtn")
    .addEventListener(
      "click",
      toggleSelectedStar
    );


  $("deleteReadBtn")
    .addEventListener(
      "click",
      deleteCurrentMessage
    );


  $("mobileBack")
    .addEventListener(
      "click",
      closeReadPane
    );


  /* -------------------------------------------------------
     LOGOUT
     ------------------------------------------------------- */

  $("logoutBtn")
    .addEventListener(
      "click",
      logout
    );


  /* -------------------------------------------------------
     OUTSIDE SUGGESTION CLICK
     ------------------------------------------------------- */

  document.addEventListener(
    "click",
    event => {

      if(
        !event.target.closest(
          ".compose-to-wrap"
        )
      ){

        hideSuggestions();

      }

    }
  );


  /* -------------------------------------------------------
     VISIBILITY
     ------------------------------------------------------- */

  document.addEventListener(
    "visibilitychange",
    handleVisibilityChange
  );


  /* -------------------------------------------------------
     BEFORE UNLOAD
     ------------------------------------------------------- */

  window.addEventListener(
    "beforeunload",
    stopAutoRefresh
  );

}


/* =========================================================
   SESSION
   ========================================================= */

function loadSession(){

  try{

    const sessionRaw =
      localStorage.getItem(
        SESSION_KEY
      );

    const userRaw =
      localStorage.getItem(
        USER_KEY
      );


    if(!sessionRaw){

      clearSession();

      return;

    }


    /*
     * Current login.html stores:
     *
     * {
     *   token,
     *   user,
     *   createdAt
     * }
     */

    try{

      state.session =
        JSON.parse(sessionRaw);

    }catch{

      /*
       * Compatibility with an older
       * raw-token storage format.
       */

      state.session = {
        token: sessionRaw
      };

    }


    if(userRaw){

      try{

        state.user =
          JSON.parse(userRaw);

      }catch{

        state.user = null;

      }

    }


    if(
      !state.user &&
      state.session?.user
    ){

      state.user =
        state.session.user;

    }


    if(
      !state.session?.token
    ){

      clearSession();

    }

  }catch(error){

    console.error(
      "Session loading failed:",
      error
    );

    clearSession();

  }

}


function clearSession(){

  localStorage.removeItem(
    SESSION_KEY
  );

  localStorage.removeItem(
    USER_KEY
  );

  state.session = null;

  state.user = null;

}


function getToken(){

  return state.session?.token || "";

}


/* =========================================================
   USER DISPLAY
   ========================================================= */

function populateUser(){

  const user =
    state.user || {};


  const name =
    user.fullName ||
    user.Full_Name ||
    user.name ||
    user.Name ||
    user.userId ||
    user.User_ID ||
    user.email ||
    user.Email_Address ||
    "User";


  const role =
    user.designation ||
    user.Designation ||
    user.role ||
    user.Role ||
    "Mailbox User";


  $("accountName").textContent =
    name;


  $("accountRole").textContent =
    role;


  $("avatar").textContent =
    initials(name);

}


function initials(value){

  if(!value){

    return "U";

  }


  const parts =
    String(value)
      .trim()
      .split(/\s+/)
      .filter(Boolean);


  if(parts.length === 1){

    return parts[0]
      .substring(0,2)
      .toUpperCase();

  }


  return (
    parts[0][0] +
    parts[parts.length - 1][0]
  ).toUpperCase();

}


/* =========================================================
   API
   ========================================================= */

async function apiRequest(
  action,
  payload = {}
){

  if(
    !MAILBOX_CONFIG.API_URL ||
    MAILBOX_CONFIG.API_URL.includes(
      "PASTE_YOUR_"
    )
  ){

    throw new Error(
      "Mailbox API URL has not been configured."
    );

  }


  const request = {

    action: action,

    /*
     * IMPORTANT:
     * New Code.gs expects "token",
     * NOT "sessionToken".
     */

    token: getToken(),

    ...payload

  };


  const response =
    await fetch(
      MAILBOX_CONFIG.API_URL,
      {
        method: "POST",

        headers: {
          "Content-Type":
            "text/plain;charset=utf-8"
        },

        body:
          JSON.stringify(request)
      }
    );


  const text =
    await response.text();


  let data;


  try{

    data =
      JSON.parse(text);

  }catch(error){

    console.error(
      "Invalid API response:",
      text
    );

    throw new Error(
      "Invalid response received from mailbox server."
    );

  }


  if(
    data?.sessionExpired ||
    data?.code === "SESSION_EXPIRED" ||
    data?.errorCode === "SESSION_EXPIRED"
  ){

    handleSessionExpired();

    throw new Error(
      "Your session has expired."
    );

  }


  if(
    data &&
    data.ok === false
  ){

    throw new Error(
      data.message ||
      data.error ||
      "Mailbox operation failed."
    );

  }


  return data;

}


/* =========================================================
   SESSION EXPIRED
   ========================================================= */

function handleSessionExpired(){

  clearSession();

  stopAutoRefresh();


  showToast(
    "error",
    "Your session has expired. Please sign in again."
  );


  setTimeout(
    () => {

      window.location.href =
        "index.html";

    },
    1200
  );

}


/* =========================================================
   LOADING
   ========================================================= */

function setLoading(
  show,
  text = "Loading mailbox..."
){

  state.loading =
    show;


  $("loadingText").textContent =
    text;


  $("loadingOverlay")
    .classList.toggle(
      "show",
      show
    );

}


/* =========================================================
   LOAD MAILBOX
   ========================================================= */

async function loadMailbox(
  showLoader = false
){

  if(showLoader){

    setLoading(
      true,
      "Loading mailbox..."
    );

  }


  try{

    let result;


    if(state.searchMode){

      result =
        await apiRequest(
          "search",
          {
            folder:
              state.activeFolder,

            search:
              state.searchQuery,

            page: 1,

            pageSize:
              MAILBOX_CONFIG.PAGE_SIZE
          }
        );

    }else{

      result =
        await apiRequest(
          "mailbox",
          {
            folder:
              state.activeFolder,

            page: 1,

            pageSize:
              MAILBOX_CONFIG.PAGE_SIZE
          }
        );

    }


    const messages =
      result.messages ||
      result.results ||
      [];


    state.messages =
      messages.map(
        normalizeMessage
      );


    renderCurrentFolder();


    /*
     * Keep currently opened message
     * if it still exists.
     */

    if(state.selectedMailId){

      const exists =
        state.messages.some(
          item =>
            String(item.mailId) ===
            String(state.selectedMailId)
        );


      if(!exists){

        closeReadPane();

      }

    }

  }catch(error){

    console.error(
      "Mailbox loading error:",
      error
    );


    if(
      !String(error.message)
        .toLowerCase()
        .includes("session has expired")
    ){

      showToast(
        "error",
        error.message ||
        "Unable to load mailbox."
      );

    }

  }finally{

    if(showLoader){

      setLoading(false);

    }

  }

}


/* =========================================================
   NORMALIZE MESSAGE
   ========================================================= */

function normalizeMessage(item){

  return {

    mailId:
      item.mailId ??
      item.Mail_ID ??
      item.mailID ??
      item.id ??
      "",


    referenceNo:
      item.referenceNo ??
      item.Reference_No ??
      "",


    threadId:
      item.threadId ??
      item.Thread_ID ??
      "",


    messageId:
      item.messageId ??
      item.Message_ID ??
      "",


    subject:
      item.subject ??
      item.Subject ??
      "(No subject)",


    senderName:
      item.senderName ??
      item.Sender_Name ??
      item.sender_name ??
      item.fromName ??
      item.From_Name ??
      item.senderEmail ??
      item.Sender_Email ??
      "Unknown",


    senderEmail:
      item.senderEmail ??
      item.Sender_Email ??
      item.from ??
      "",


    to:
      item.to ??
      item.To ??
      "",


    cc:
      item.cc ??
      item.CC ??
      item.Cc ??
      "",


    bcc:
      item.bcc ??
      item.BCC ??
      item.Bcc ??
      "",


    preview:
      item.body ??
      item.preview ??
      item.Preview ??
      item.snippet ??
      item.Snippet ??
      "",


    body:
      item.body ??
      item.Body ??
      "",


    bodyType:
      item.bodyType ??
      item.Body_Type ??
      "TEXT",


    date:
      item.date ??
      item.Date ??
      "",


    isRead:
      toBoolean(
        item.isRead ??
        item.Is_Read ??
        false
      ),


    starred:
      toBoolean(
        item.isStarred ??
        item.starred ??
        item.Is_Starred ??
        false
      ),


    hasAttachments:
      toBoolean(
        item.hasAttachment ??
        item.hasAttachments ??
        item.Has_Attachment ??
        item.Has_Attachments ??
        false
      ),


    attachmentCount:
      Number(
        item.attachmentCount ??
        item.Attachment_Count ??
        0
      ),


    folder:
      item.folder ??
      item.Folder ??
      state.activeFolder,


    label:
      item.label ??
      item.Label ??
      ""

  };

}


/* =========================================================
   BOOLEAN NORMALIZATION
   ========================================================= */

function toBoolean(value){

  if(
    value === true ||
    value === 1
  ){

    return true;

  }


  if(
    typeof value === "string"
  ){

    return [
      "true",
      "1",
      "yes",
      "y"
    ].includes(
      value.toLowerCase()
    );

  }


  return false;

}

    DRAFT: "Drafts",

/* =========================================================

        <div class="mail-main">

            <div class="sender">

              )}
            </div>

            <div class="date">

                message.date
              )}
            </div>

          </div>


          <div class="subject">
            ${escapeHtml(
              message.subject
            )}
          </div>


          <div class="preview">
            ${escapeHtml(
              stripHtml(
                message.preview
              )
            )}
          </div>

        </div>


        <button
          class="star ${
            message.starred
              ? "active"
              : ""
          }"
          data-star="${escapeHtml(
            message.mailId
          )}"
          title="${
            message.starred
              ? "Unstar"
              : "Star"
          }"
        >

          <svg viewBox="0 0 24 24"
               fill="${
                 message.starred
                   ? "currentColor"
                   : "none"
               }"
               stroke="currentColor"
               stroke-width="1.8"
               stroke-linejoin="round">

            <path d="m12 3 2.8 5.8

                     -5.6 2.9 1.1-6.2
                     L3 9.7l6.2-.9z"/>

      `;

        event => {

          if(
            event.target.closest(

            event.target.closest(
              ".mail-check"
            )
          ){

            return;

          }


          openMessage(
            message.mailId
          );

        }
      );


      const star =
        row.querySelector(
          ".star"
        );


      star.addEventListener(
        "click",
        event => {

          event.stopPropagation();

            message.mailId,

          );

        }
      );


      mailList.appendChild(
        row
      );

    }

/* =========================================================
   OPEN MESSAGE
   ========================================================= */

async function openMessage(
  mailId
){

  state.selectedMailId =
    String(mailId);


  const meta =
    state.messages.find(
      item =>
        String(item.mailId) ===
        String(mailId)
    );


  if(meta){

    renderMessageHeader(
      meta
    );

  }


  readEmpty.classList.add(
    "hidden"
  );


  readContent.classList.remove(
    "hidden"
  );


  if(window.innerWidth <= 760){

    readPane.classList.add(
      "mobile-show"
    );

  }


  $("readBody").innerHTML = `

    <div style="
      color:var(--muted);
      font-size:12px
    ">

      Loading message...

    </div>

  `;


  try{

    const result =
      await apiRequest(
        "getMessage",
        {
          mailId: mailId
        }
      );


    const message =
      normalizeFullMessage(
        result.message ||
        result
      );


    state.selectedMessage =
      message;


    renderFullMessage(
      message,
      result.attachments || []
    );


    /*
     * New backend:
     * mark read using updateMessage.
     */

    if(!message.isRead){

      await updateMessage(
        mailId,
        {
          Is_Read: true
        },
        false
      );

    }

  }catch(error){

    console.error(
      "Open message error:",
      error
    );


    $("readBody").innerHTML = `

      <div style="
        color:var(--danger);
        font-size:12px
      ">

        ${escapeHtml(
          error.message ||
          "Unable to load message."
        )}

      </div>

    `;

  }

}


/* =========================================================
   NORMALIZE FULL MESSAGE
   ========================================================= */

function normalizeFullMessage(
  message
){

  return {

    mailId:
      message.mailId ??
      message.Mail_ID ??
      message.id ??
      state.selectedMailId,


    referenceNo:
      message.referenceNo ??
      message.Reference_No ??
      "",


    threadId:
      message.threadId ??
      message.Thread_ID ??
      "",


    messageId:
      message.messageId ??
      message.Message_ID ??
      "",


    subject:
      message.subject ??
      message.Subject ??
      "(No subject)",


    senderName:
      message.senderName ??
      message.Sender_Name ??
      message.fromName ??
      message.From_Name ??
      message.senderEmail ??
      message.Sender_Email ??
      "",


    senderEmail:
      message.senderEmail ??
      message.Sender_Email ??
      message.from ??
      "",


    to:
      message.to ??
      message.To ??
      "",


    cc:
      message.cc ??
      message.CC ??
      message.Cc ??
      "",


    bcc:
      message.bcc ??
      message.BCC ??
      message.Bcc ??
      "",


    body:
      message.body ??
      message.Body ??
      "",


    bodyType:
      message.bodyType ??
      message.Body_Type ??
      "TEXT",


    date:
      message.date ??
      message.Date ??
      "",


    folder:
      message.folder ??
      message.Folder ??
      "",


    status:
      message.status ??
      message.Status ??
      "",


    isRead:
      toBoolean(
        message.isRead ??
        message.Is_Read ??
        false
      ),


    starred:
      toBoolean(
        message.isStarred ??
        message.starred ??
        message.Is_Starred ??
        false
      ),


    hasAttachment:
      toBoolean(
        message.hasAttachment ??
        message.Has_Attachment ??
        false
      ),


    attachmentCount:
      Number(
        message.attachmentCount ??
        message.Attachment_Count ??
        0
      ),


    label:
      message.label ??
      message.Label ??
      "",


    replyTo:
      message.replyTo ??
      message.Reply_To ??
      "",


    forwardedFrom:
      message.forwardedFrom ??
      message.Forwarded_From ??
      "",


    parentMessageId:
      message.parentMessageId ??
      message.Parent_Message_ID ??
      ""

  };

}


/* =========================================================
   RENDER MESSAGE HEADER
   ========================================================= */

function renderMessageHeader(
  message
){

  $("readSubject").textContent =
    message.subject ||
    "(No subject)";


  $("readSenderName").textContent =
    message.senderName ||
    "Unknown sender";


  $("readSenderEmail").textContent =
    message.senderEmail ||
    "";


  $("readRecipients").textContent =
    message.to
      ? "To: " + message.to
      : "";


  $("readDate").textContent =
    formatFullDate(
      message.date
    );


  $("readAvatar").textContent =
    initials(
      message.senderName ||
      message.senderEmail
    );


  updateReadStar(
    Boolean(message.starred)
  );

}


/* =========================================================
   RENDER FULL MESSAGE
   ========================================================= */

function renderFullMessage(
  message,
  attachments = []
){

  renderMessageHeader(
    message
  );


  const body =
    message.body || "";


  if(
    String(message.bodyType)
      .toUpperCase() === "HTML"
  ){

    $("readBody").innerHTML =
      sanitizeBasicHtml(
        body
      );

  }else{

    $("readBody").innerHTML =
      escapeHtml(body)
        .replace(
          /\n/g,
          "<br>"
        );

  }


  renderAttachments(
    attachments
  );

}


/* =========================================================
   ATTACHMENTS
   ========================================================= */

function renderAttachments(
  attachments
){

  const container =
    $("attachmentList");


  container.innerHTML =
    "";


  if(
    !Array.isArray(
      attachments
    ) ||
    !attachments.length
  ){

    container.classList.add(
      "hidden"
    );

    return;

  }


  container.classList.remove(
    "hidden"
  );


  attachments.forEach(
    file => {

      const name =
        file.name ??
        file.fileName ??
        file.File_Name ??
        "Attachment";


      const url =
        file.url ??
        file.downloadUrl ??
        file.Download_URL ??
        file.Drive_URL ??
        "#";


      const item =
        document.createElement(
          "a"
        );


      item.className =
        "attachment";


      item.href =
        url;


      item.target =
        "_blank";


      item.rel =
        "noopener";


      item.innerHTML = `

        <svg width="15"
             height="15"
             viewBox="0 0 24 24"
             fill="none"
             stroke="currentColor"
             stroke-width="1.8">

          <path d="M12 3v12"/>
          <path d="m7 10 5 5 5-5"/>
          <path d="M5 21h14"/>

        </svg>

        ${escapeHtml(name)}

      `;


      container.appendChild(
        item
      );

    }
  );

}


/* =========================================================
   GENERIC UPDATE MESSAGE
   ========================================================= */

async function updateMessage(
  mailId,
  fields,
  showError = true
){

  try{

    const result =
      await apiRequest(
        "updateMessage",
        {
          mailId: mailId,
          ...fields
        }
      );


    if(
      !result ||
      result.ok === false
    ){

      throw new Error(
        result?.message ||
        "Unable to update message."
      );

    }


    return result;

  }catch(error){

    console.error(
      "updateMessage error:",
      error
    );


    if(showError){

      showToast(
        "error",
        error.message ||
        "Unable to update message."
      );

    }


    throw error;

  }

}


/* =========================================================
   STAR
   ========================================================= */

async function toggleStar(
  mailId,
  starred
){

  const oldValue =
    state.messages.find(
      item =>
        String(item.mailId) ===
        String(mailId)
    )?.starred;


  updateLocalStar(
    mailId,
    starred
  );


  try{

    await updateMessage(
      mailId,
      {
        Is_Starred: starred
      },
      true
    );

  }catch(error){

    updateLocalStar(
      mailId,
      Boolean(oldValue)
    );

  }

}


function toggleSelectedStar(){

  if(!state.selectedMessage){

    return;

  }


  const current =
    Boolean(
      state.selectedMessage.starred
    );


  toggleStar(
    state.selectedMessage.mailId,
    !current
  );

}


function updateLocalStar(
  mailId,
  starred
){

  state.messages =
    state.messages.map(
      item => {

        if(
          String(item.mailId) ===
          String(mailId)
        ){

          return {
            ...item,
            starred: starred,
            isStarred: starred
          };

        }

        return item;

      }
    );


  renderCurrentFolder();


  if(
    state.selectedMessage &&
    String(
      state.selectedMessage.mailId
    ) === String(mailId)
  ){

    state.selectedMessage.starred =
      starred;


    updateReadStar(
      starred
    );

  }

}


function updateReadStar(
  starred
){

  const button =
    $("starReadBtn");


  button.classList.toggle(
    "active",
    starred
  );


  button.innerHTML = `

    <svg viewBox="0 0 24 24"
         fill="${
           starred
             ? "currentColor"
             : "none"
         }"
         stroke="currentColor"
         stroke-width="1.8"
         stroke-linejoin="round">

      <path d="m12 3 2.8 5.8
               6.2.9-4.5 4.4
               1.1 6.2-5.6-2.9
               -5.6 2.9 1.1-6.2
               L3 9.7l6.2-.9z"/>

    </svg>

  `;

}


/* =========================================================
   DELETE
   ========================================================= */

async function deleteCurrentMessage(){

  if(!state.selectedMailId){

    return;

  }


  const id =
    state.selectedMailId;


  const confirmed =
    window.confirm(
      "Move this message to Trash?"
    );


  if(!confirmed){

    return;

  }


  try{

    await updateMessage(
      id,
      {
        Is_Deleted: true
      },
      true
    );


    state.messages =
      state.messages.filter(
        item =>
          String(item.mailId) !==
          String(id)
      );


    closeReadPane();


    renderCurrentFolder();


    showToast(
      "success",
      "Message moved to Trash."
    );


  }catch(error){

    /* updateMessage already displayed error */

  }

}

/* =========================================================
   SEARCH
   ========================================================= */

function handleSearchInput(){

  const value =
    $("searchInput")
      .value
      .trim();


  $("clearSearch")
    .style.display =
      value
        ? "block"
        : "none";


  clearTimeout(
    state.searchTimer
  );


  if(!value){

    state.searchMode =
      false;


    state.searchQuery =
      "";


    loadMailbox(
      false
    );


    return;

  }


  state.searchTimer =
    setTimeout(
      () => performSearch(value),
      MAILBOX_CONFIG.SEARCH_DELAY_MS
    );

}


async function performSearch(
  query
){

  state.searchMode =
    true;


  state.searchQuery =
    query;


  listTitle.textContent =
    `Search: ${query}`;


  mailList.innerHTML = `

    <div class="empty">

      <div class="big-spinner"></div>

      <div style="margin-top:12px">
        Searching...
      </div>

    </div>

  `;


  try{

    const result =
      await apiRequest(
        "search",
        {
          folder:
            state.activeFolder,

          search:
            query,

          page: 1,

          pageSize:
            MAILBOX_CONFIG.PAGE_SIZE
        }
      );


    state.messages =
      (
        result.messages ||
        result.results ||
        []
      ).map(
        normalizeMessage
      );


    renderMessageList(
      state.messages
    );

  }catch(error){

    console.error(
      "Search error:",
      error
    );


    mailList.innerHTML = `

      <div class="empty">

        <div class="empty-title">
          Search failed
        </div>

        <div class="empty-text">

          ${escapeHtml(
            error.message ||
            "Unable to search."
          )}

        </div>

      </div>

    `;

  }

}


function clearSearch(){

  $("searchInput").value =
    "";


  $("clearSearch")
    .style.display =
      "none";


  state.searchMode =
    false;


  state.searchQuery =
    "";


  loadMailbox(
    false
  );

}


/* =========================================================
   COMPOSE
   ========================================================= */

function openCompose(
  mode = "new",
  message = null
){

  state.composeMode =
    mode;


  state.composeMessageId =
    message?.mailId ||
    null;


  resetCompose();


  state.composeMode =
    mode;


  state.composeMessageId =
    message?.mailId ||
    null;


  if(
    mode === "reply" &&
    message
  ){

    $("composeTitle")
      .textContent =
        "Reply";


    $("composeTo").value =
      message.senderEmail ||
      "";


    $("composeSubject").value =
      message.subject
        ? (
          message.subject
            .toLowerCase()
            .startsWith("re:")
              ? message.subject
              : "Re: " +
                message.subject
        )
        : "Re:";


    $("composeBody").value =
      "\n\n--------------------\n" +
      "From: " +
      (message.senderEmail || "") +
      "\nDate: " +
      formatFullDate(
        message.date
      ) +
      "\nSubject: " +
      (message.subject || "") +
      "\n\n" +
      stripHtml(
        message.body || ""
      );

  }


  if(
    mode === "forward" &&
    message
  ){

    $("composeTitle")
      .textContent =
        "Forward";


    $("composeSubject").value =
      message.subject
        ? (
          message.subject
            .toLowerCase()
            .startsWith("fwd:")
              ? message.subject
              : "Fwd: " +
                message.subject
        )
        : "Fwd:";


    $("composeBody").value =
      "\n\n--------------------\n" +
      "Forwarded message\n" +
      "From: " +
      (message.senderEmail || "") +
      "\nDate: " +
      formatFullDate(
        message.date
      ) +
      "\nSubject: " +
      (message.subject || "") +
      "\n\n" +
      stripHtml(
        message.body || ""
      );

  }


  if(
    mode === "draft" &&
    message
  ){

    $("composeTitle")
      .textContent =
        "Edit Draft";


    $("composeTo").value =
      message.to || "";


    $("composeCc").value =
      message.cc || "";


    $("composeBcc").value =
      message.bcc || "";


    $("composeSubject").value =
      message.subject || "";


    $("composeBody").value =
      stripHtml(
        message.body || ""
      );

  }


  $("composeModal")
    .classList.add(
      "show"
    );


  setTimeout(
    () => {

      $("composeTo").focus();

    },
    100
  );

}


function resetCompose(){

  $("composeTo").value =
    "";


  $("composeCc").value =
    "";


  $("composeBcc").value =
    "";


  $("composeSubject").value =
    "";


  $("composeBody").value =
    "";


  $("composeTitle")
    .textContent =
      "New Message";


  state.composeMode =
    "new";


  state.composeMessageId =
    null;


  setComposeDisabled(
    false
  );


  hideSuggestions();

}


/* =========================================================
   CLOSE COMPOSE
   ========================================================= */

function closeCompose(){

  if(
    state.loading
  ){

    return;

  }


  $("composeModal")
    .classList.remove(
      "show"
    );


  hideSuggestions();

}


/* =========================================================
   SEND
   ========================================================= */

async function sendCurrentMessage(){

  const to =
    $("composeTo")
      .value
      .trim();


  const cc =
    $("composeCc")
      .value
      .trim();


  const bcc =
    $("composeBcc")
      .value
      .trim();


  const subject =
    $("composeSubject")
      .value
      .trim();


  const body =
    $("composeBody")
      .value;


  if(!to){

    showToast(
      "error",
      "Please enter at least one recipient."
    );


    $("composeTo").focus();


    return;

  }


  if(
    !body.trim() &&
    !subject
  ){

    showToast(
      "error",
      "Please enter a subject or message."
    );


    return;

  }


  setComposeDisabled(
    true
  );


  try{

    const result =
      await apiRequest(
        "sendMessage",
        {

          to: to,

          cc: cc,

          bcc: bcc,

          subject: subject,

          body: body,

          bodyType: "TEXT",

          replyTo:
            state.composeMode === "reply"
              ? state.composeMessageId
              : "",

          forwardedFrom:
            state.composeMode === "forward"
              ? state.composeMessageId
              : "",

          parentMessageId:
            state.composeMode === "reply"
              ? state.composeMessageId
              : "",

          threadId:
            state.selectedMessage?.threadId ||
            "",

          label: ""

        }
      );


    if(
      !result ||
      result.ok === false
    ){

      throw new Error(
        result?.message ||
        "Message could not be sent."
      );

    }


    closeCompose();


    showToast(
      "success",
      "Message sent successfully."
    );


    await loadMailbox(
      false
    );

  }catch(error){

    console.error(
      "Send error:",
      error
    );


    showToast(
      "error",
      error.message ||
      "Unable to send message."
    );

  }finally{

    setComposeDisabled(
      false
    );

  }

}

  );


  try{

    const result =
      await apiRequest(
        "saveDraft",
        payload
      );


    if(
      !result ||
      result.ok === false
    ){

      throw new Error(
        result?.message ||
        "Unable to save draft."
      );

    }


    closeCompose();


    showToast(
      "success",
      "Draft saved."
    );


    await loadMailbox(
      false
    );

  }catch(error){

    showToast(
      "error",
      error.message ||
      "Unable to save draft."
    );

  }finally{

    setComposeDisabled(
      false
    );

  }

}


/* =========================================================
   DISABLE COMPOSE
   ========================================================= */

function setComposeDisabled(
  disabled
){

  const controls = [

    $("composeTo"),

    $("composeCc"),

    $("composeBcc"),

    $("composeSubject"),

    $("composeBody"),

    $("saveDraftBtn"),

    $("closeCompose"),

    $("sendBtn")

  ];


  controls.forEach(
    control => {

      if(control){

        control.disabled =
          disabled;

      }

    }
  );


  $("sendBtn")
    .classList.toggle(
      "loading",
      disabled
    );

}


/* =========================================================
   RECIPIENT SUGGESTIONS
   ========================================================= */

function handleRecipientInput(){

  const query =
    $("composeTo")
      .value
      .trim();


  clearTimeout(
    state.suggestionTimer
  );


  if(
    query.length < 2
  ){

    hideSuggestions();

    return;

  }


  state.suggestionTimer =
    setTimeout(
      () => loadSuggestions(query),
      MAILBOX_CONFIG
        .SUGGESTION_DELAY_MS
    );

}


async function loadSuggestions(
  query
){

  try{

    const result =
      await apiRequest(
        "suggestRecipients",
        {
          query: query
        }
      );


    /*
     * New Code.gs returns:
     *
     * {
     *   ok:true,
     *   items:[...]
     * }
     */

    const suggestions =
      result.items ||
      result.recipients ||
      result.suggestions ||
      [];


    renderSuggestions(
      suggestions
    );

  }catch(error){

    console.warn(
      "Suggestions failed:",
      error
    );

  }

}


function renderSuggestions(
  items
){

  const box =
    $("suggestions");


  box.innerHTML =
    "";


  if(
    !Array.isArray(items) ||
    !items.length
  ){

    hideSuggestions();

    return;

  }


  items
    .slice(0,8)
    .forEach(
      item => {

        const email =
          item.email ??
          item.Email_Address ??
          item.emailAddress ??
          "";


        const name =
          item.name ??
          item.Full_Name ??
          item.fullName ??
          email;


        if(!email){

          return;

        }


        const div =
          document.createElement(
            "div"
          );


        div.className =
          "suggestion";


        div.innerHTML = `

          <div class="suggestion-name">
            ${escapeHtml(name)}
          </div>

          <div class="suggestion-email">
            ${escapeHtml(email)}
          </div>

        `;


        div.addEventListener(
          "click",
          () => {

            $("composeTo").value =
              email;


            hideSuggestions();

          }
        );


        box.appendChild(
          div
        );

      }
    );


  if(
    box.children.length
  ){

    box.classList.add(
      "show"
    );

  }

}


function hideSuggestions(){

  $("suggestions")
    .classList.remove(
      "show"
    );

}


/* =========================================================
   CLOSE READ PANE
   ========================================================= */

function closeReadPane(){

  state.selectedMailId =
    null;


  state.selectedMessage =
    null;


  readPane.classList.remove(
    "mobile-show"
  );


  readContent.classList.add(
    "hidden"
  );


  readEmpty.classList.remove(
    "hidden"
  );


  document
    .querySelectorAll(
      ".mail-row"
    )
    .forEach(
      row =>
        row.classList.remove(
          "selected"
        )
    );

}


/* =========================================================
   SELECT ALL
   ========================================================= */

function selectAllMessages(){

  const boxes =
    document.querySelectorAll(
      ".row-check"
    );


  if(!boxes.length){

    return;

  }


  const allChecked =
    Array.from(boxes)
      .every(
        box => box.checked
      );


  boxes.forEach(
    box => {

      box.checked =
        !allChecked;

    }
  );

}


/* =========================================================
   AUTO REFRESH
   ========================================================= */

function startAutoRefresh(){

  stopAutoRefresh();


  state.refreshTimer =
    setInterval(
      () => {

        if(
          document.visibilityState ===
          "visible" &&
          !state.loading &&
          !state.searchMode
        ){

          /*
           * Silent refresh.
           * No loading overlay.
           */

          loadMailbox(
            false
          );

        }

      },
      MAILBOX_CONFIG.AUTO_REFRESH_MS
    );

}


function stopAutoRefresh(){

  if(
    state.refreshTimer
  ){

    clearInterval(
      state.refreshTimer
    );


    state.refreshTimer =
      null;

  }

}


/* =========================================================
   VISIBILITY
   ========================================================= */

function handleVisibilityChange(){

  if(
    document.visibilityState ===
    "visible"
  ){

    loadMailbox(
      false
    );

  }

}


/* =========================================================
   LOGOUT
   ========================================================= */

async function logout(){

  const confirmed =
    window.confirm(
      "Do you want to logout?"
    );


  if(!confirmed){

    return;

  }


  try{

    await apiRequest(
      "logout"
    );

  }catch(error){

    console.warn(
      "Logout API error:",
      error
    );

  }


  clearSession();


  stopAutoRefresh();


  window.location.href =
    "index.html";

}


/* =========================================================
   TOAST
   ========================================================= */

let toastTimer;


function showToast(
  type,
  message
){

  const toast =
    $("toast");


  const icon =
    $("toastIcon");


  $("toastMessage")
    .textContent =
      message;


  toast.className =
    "toast " + type;


  if(
    type === "success"
  ){

    icon.innerHTML = `

      <svg viewBox="0 0 24 24"
           fill="none"
           stroke="currentColor"
           stroke-width="2"
           color="var(--success)">

        <circle cx="12"
                cy="12"
                r="9"/>

        <path d="m8 12
                 2.7 2.7
                 L16.5 9"/>

      </svg>

    `;

  }else{

    icon.innerHTML = `

      <svg viewBox="0 0 24 24"
           fill="none"
           stroke="currentColor"
           stroke-width="2"
           color="var(--danger)">

        <circle cx="12"
                cy="12"
                r="9"/>

        <path d="M12 7v5"/>

        <path d="M12 16h.01"/>

      </svg>

    `;

  }


  requestAnimationFrame(
    () =>
      toast.classList.add(
        "show"
      )
  );


  clearTimeout(
    toastTimer
  );


  toastTimer =
    setTimeout(
      () => {

        toast.classList.remove(
          "show"
        );

      },
      3500
    );

}


/* =========================================================
   DATE FORMATTING
   ========================================================= */

function formatShortDate(
  value
){

  if(!value){

    return "";

  }


  const date =
    new Date(value);


  if(
    Number.isNaN(
      date.getTime()
    )
  ){

    return String(value);

  }


  const now =
    new Date();


  if(
    date.toDateString() ===
    now.toDateString()
  ){

    return date.toLocaleTimeString(
      [],
      {
        hour: "2-digit",
        minute: "2-digit"
      }
    );

  }


  return date.toLocaleDateString(
    [],
    {
      day: "2-digit",
      month: "short"
    }
  );

}


function formatFullDate(
  value
){

  if(!value){

    return "";

  }


  const date =
    new Date(value);


  if(
    Number.isNaN(
      date.getTime()
    )
  ){

    return String(value);

  }


  return date.toLocaleString(
    [],
    {
      day: "2-digit",
      month: "short",
      year: "numeric",
      hour: "2-digit",
      minute: "2-digit"
    }
  );

}


/* =========================================================
   HTML HELPERS
   ========================================================= */

function escapeHtml(
  value
){

  return String(
    value ?? ""
  )
  .replace(
    /&/g,
    "&amp;"
  )
  .replace(
    /</g,
    "&lt;"
  )
  .replace(
    />/g,
    "&gt;"
  )
  .replace(
    /"/g,
    "&quot;"
  )
  .replace(
    /'/g,
    "&#039;"
  );

}


function stripHtml(
  html
){

  const div =
    document.createElement(
      "div"
    );


  div.innerHTML =
    String(
      html ?? ""
    );


  return (
    div.textContent ||
    div.innerText ||
    ""
  );

}


function sanitizeBasicHtml(
  html
){

  const template =
    document.createElement(
      "template"
    );


  template.innerHTML =
    String(
      html ?? ""
    );


  template.content
    .querySelectorAll(
      "script,iframe,object,embed,form"
    )
    .forEach(
      el => el.remove()
    );


  template.content
    .querySelectorAll("*")
    .forEach(
      el => {

        Array.from(
          el.attributes
        )
        .forEach(
          attr => {

            const name =
              attr.name
                .toLowerCase();


            if(
              name.startsWith(
                "on"
              )
            ){

              el.removeAttribute(
                attr.name
              );

            }


            if(
              name === "href" ||
              name === "src"
            ){

              const value =
                String(
                  attr.value ||
                  ""
                )
                .trim()
                .toLowerCase();


              if(
                value.startsWith(
                  "javascript:"
                ) ||
                value.startsWith(
                  "data:text/html"
                )
              ){

                el.removeAttribute(
                  attr.name
                );

              }

            }

          }
        );

      }
    );


  return template.innerHTML;

}
